name: Publish

# Publish on a version bump, not on every push to master. Source paths are
# included so a re-run after a transient registry failure does not need a
# dummy version change. Existing versions exit cleanly.
#
# Unlike the other house workflows, this one reads a version per crate rather
# than asserting one workspace version. There are eight publishable crates here
# on three independent lines: ps-vello, ps-vello-encoding and ps-vello-shaders
# share the workspace version, the four sparse-strips crates are on their own,
# and ps-glifo on another. Asserting a single version would abort every run.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - "*/Cargo.toml"
      - sparse_strips/*/Cargo.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify, but do not upload'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      - name: Are these versions already on crates.io?
        id: check
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          # Dependency order: a crate cannot publish before the crates it
          # depends on exist on the registry. Maintained by hand because it
          # changes about once a year.
          for crate_name in ps-vello-encoding ps-vello-shaders ps-vello ps-glifo ps-vello-common ps-vello-sparse-shaders ps-vello-cpu ps-vello-hybrid; do
            package_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .version')
            if [ -z "$package_version" ] || [ "$package_version" = "null" ]; then
              echo "$crate_name is not a package in this workspace" >&2
              exit 1
            fi
            published=$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$crate_name/versions" \
              | jq -r --arg v "$package_version" '.versions[]? | select(.num == $v) | .num' || true)
            if [ -n "$published" ]; then
              echo "$crate_name $package_version is already published"
            else
              missing="$missing $crate_name"
              echo "$crate_name $package_version is new"
            fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.already == 'false'
        run: cargo build --release

      - name: Test
        if: steps.check.outputs.already == 'false'
        run: cargo test --release -p ps-vello

      - name: Package dry run
        if: steps.check.outputs.already == 'false' && inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail
          for crate_name in ${{ steps.check.outputs.missing }}; do
            cargo package -p "$crate_name" --no-verify
          done

      - name: Publish
        if: steps.check.outputs.already == 'false' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on this repository" >&2
            echo "Add it under Settings -> Secrets -> Actions." >&2
            exit 1
          fi
          # Re-check rather than trusting the earlier step: publishing cannot
          # be undone, and a concurrent release may have landed in between.
          for crate_name in ps-vello-encoding ps-vello-shaders ps-vello ps-glifo ps-vello-common ps-vello-sparse-shaders ps-vello-cpu ps-vello-hybrid; do
            package_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .version')
            published=$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$crate_name/versions" \
              | jq -r --arg v "$package_version" '.versions[]? | select(.num == $v) | .num' || true)
            if [ -n "$published" ]; then
              echo "$crate_name $package_version is already published; skipping"
            else
              cargo publish -p "$crate_name" --registry crates-io
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            if [ '${{ steps.check.outputs.already }}' = 'true' ]; then
              echo "Nothing to publish: every publishable crate is already on crates.io at its current version."
              echo
              echo 'Bump a `version` to cut a new release.'
            elif [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo "Dry run: packaged \`${{ steps.check.outputs.missing }}\` without uploading."
            else
              echo "Published \`${{ steps.check.outputs.missing }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
