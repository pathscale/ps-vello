name: Publish

# Publish on a version bump, not on every push to master. Source paths are
# included so a re-run after a transient registry failure does not need a
# dummy version change. Existing versions exit cleanly.
#
# Every publishable crate takes `version.workspace = true`, so there is one
# number to bump. Five of them used to carry their own, which is how this fork
# ended up publishing ps-vello 0.10.1 beside ps-vello-common 0.2.0.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - "*/Cargo.toml"
      - sparse_strips/*/Cargo.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify, but do not upload'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      - name: Package
        if: inputs.dry_run
        run: cargo package --workspace

      # Cargo knows which crates are publishable, what order they depend on
      # each other in, and which versions are already on the registry. Saying
      # any of that again here would be a second copy to keep correct, and the
      # copy is what goes stale when a crate is added.
      - name: Publish
        if: '!inputs.dry_run'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
